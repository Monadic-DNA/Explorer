[package]
name = "explorer-core"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
ffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
uniffi = { version = "0.29", optional = true }

# Native encrypted store. SQLCipher uses CommonCrypto on Apple platforms and a vendored OpenSSL elsewhere.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
[target.'cfg(all(not(target_arch = "wasm32"), not(target_vendor = "apple")))'.dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"
getrandom = "0.3"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
