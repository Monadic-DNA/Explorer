name: Native clients

on:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: python3 scripts/prepare-public-sample.py
      - run: node scripts/build-native.mjs android arm64-v8a
      - run: apps/android/gradlew -p apps/android assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: explorer-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
      - run: node scripts/build-native.mjs android x86_64
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: apps/android/gradlew -p apps/android -PexplorerAbis=x86_64 connectedDebugAndroidTest --no-daemon

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: brew install xcodegen
      - run: python3 scripts/prepare-public-sample.py
      - run: node scripts/build-native.mjs ios simulator
      - name: Run native binding tests in iOS Simulator
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild -resultBundlePath apps/ios/ExplorerTests.xcresult -project apps/ios/Explorer.xcodeproj -scheme Explorer -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath apps/ios/build test CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: explorer-ios-test-results
          path: apps/ios/ExplorerTests.xcresult
