name: PR Build & Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      billing-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: billing-test-only
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U explorer -d billing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify store billing and atomic purchase ledger
        run: |
          node scripts/migrate-mobile-billing.mjs
          npm run test:billing
          npm run vault:migrate
          npm run test:vault-sync
        env:
          POSTGRES_DB: postgresql://explorer:billing-test-only@127.0.0.1:5432/billing_test
          BILLING_DB_TEST: 'true'
          VAULT_DB_TEST: 'true'

      - name: Install shared core toolchain
        run: rustup show active-toolchain

      - name: Test Rust and WASM contracts
        run: |
          npm run core:test
          npm test

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare full public 23andMe sample and browser
        run: |
          npm run test:public-sample:prepare
          npx playwright install --with-deps chromium

      - name: Verify public sample import, scores, export and portable vault in Chromium
        run: |
          node node_modules/next/dist/bin/next start > /tmp/explorer-public-sample-server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          node --input-type=module <<'JS'
          let ready=false;
          for(let attempt=0;attempt<60;attempt++) {
            try { if((await fetch('http://127.0.0.1:3000')).ok){ready=true;break;} } catch {}
            await new Promise(resolve=>setTimeout(resolve,500));
          }
          if(!ready)throw new Error('Production server did not start');
          JS
          npm run test:public-sample:web

      - name: Upload public sample browser evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-sample-browser-evidence
          include-hidden-files: true
          path: |
            .test-data/public-sample/*.png
            .test-data/public-sample/web-results.tsv
          retention-days: 7

      - name: Upload build artifacts
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .next
          retention-days: 7
